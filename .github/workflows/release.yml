name: Release

# Build Windows, Linux, and an unsigned iOS IPA, then publish them all to a
# single GitHub Release. Triggered by pushing a version tag (e.g. v3.0.0),
# or manually via the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch Windows tools (yt-dlp + ffmpeg)
        shell: pwsh
        run: |
          $dest = "YouTubeDownloader/Tools/win-x64"
          New-Item -ItemType Directory -Force $dest | Out-Null
          curl.exe -L -o "$dest/yt-dlp.exe" `
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl.exe -L -o "$dest/ffmpeg.zip" `
            https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          Expand-Archive "$dest/ffmpeg.zip" "$dest/tmp" -Force
          $bin = Get-ChildItem "$dest/tmp" -Directory | Select-Object -First 1 |
                 ForEach-Object { Join-Path $_.FullName 'bin' }
          Copy-Item "$bin/ffmpeg.exe","$bin/ffprobe.exe" $dest
          Copy-Item "$bin/*.dll" $dest
          Remove-Item "$dest/tmp" -Recurse -Force
          Remove-Item "$dest/ffmpeg.zip"

      - name: Publish single-file exe
        run: >
          dotnet publish YouTubeDownloader/YouTubeDownloader.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist

      - name: Rename artifact
        shell: pwsh
        run: Rename-Item dist/YouTubeDownloader.exe YouTubeDownloader-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/YouTubeDownloader-windows-x64.exe

  # ------------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch Linux tools (yt-dlp + static ffmpeg)
        run: |
          set -e
          dest=YouTubeDownloader/Tools/linux-x64
          mkdir -p "$dest"
          curl -fL -o "$dest/yt-dlp" \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          # yt-dlp's own static FFmpeg build (reliable GitHub host).
          curl -fL -o "$dest/ffmpeg.tar.xz" \
            https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf "$dest/ffmpeg.tar.xz" -C "$dest"
          d=$(ls -d "$dest"/ffmpeg-*-linux64-gpl | head -1)
          cp "$d/bin/ffmpeg" "$d/bin/ffprobe" "$dest/"
          rm -rf "$d" "$dest/ffmpeg.tar.xz"

      - name: Publish single-file binary
        run: >
          dotnet publish YouTubeDownloader/YouTubeDownloader.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist

      - name: Rename artifact
        run: mv dist/YouTubeDownloader YouTubeDownloader-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: YouTubeDownloader-linux-x64

  # --------------------------------------------------------------------- iOS
  # Unsigned IPA. Sideloaders (AltStore / Sideloadly) re-sign with the
  # installer's own Apple ID, so we deliberately skip code signing here.
  ios:
    runs-on: macos-15
    # Best-effort: if the iOS build needs a tweak, Windows + Linux still ship.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The macOS runner defaults to a newer SDK whose iOS workload ships
      # net9/net10 packs and flags net8.0-ios as EOL. Pin to the .NET 8 SDK
      # so its iOS workload (net8 / iOS 17 SDK) matches Avalonia.iOS 11.2.3
      # (net8.0-ios17.0).
      - name: Pin .NET 8 SDK
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "8.0.0",
              "rollForward": "latestFeature"
            }
          }
          JSON
          dotnet --version

      - name: Install iOS workload
        run: dotnet workload install ios

      # The .NET 8 iOS workload is built against the iOS 18 SDK, so an untrimmed
      # build needs Xcode 16. Pick the newest 16.x on the runner explicitly.
      # Real directories only: the image also has symlink aliases such as
      # Xcode_16.4.0.app, and clang/SDK lookups fail through those.
      - name: Select Xcode 16
        run: |
          set -e
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk macosx --show-sdk-path
          xcrun -f clang

      - name: Build app bundle (unsigned, device arm64, full AOT)
        run: >
          dotnet publish YouTubeDownloader.iOS/YouTubeDownloader.iOS.csproj
          -c Release -f net8.0-ios -r ios-arm64
          -p:EnableCodeSigning=false
          -p:CodesignKey=
          -p:MtouchLink=None
          -o ios-out

      - name: Collect unsigned IPA
        run: |
          set -e
          # .NET iOS device publish usually emits an .ipa directly. If so, use
          # it; otherwise fall back to zipping the .app bundle into a Payload.
          IPA=$(find ios-out -maxdepth 2 -name "*.ipa" | head -1)
          if [ -n "$IPA" ]; then
            echo "Using produced IPA: $IPA"
            cp "$IPA" YouTubeDownloader-ios.ipa
          else
            APP=$(find ios-out -maxdepth 3 -name "*.app" -type d | head -1)
            if [ -z "$APP" ]; then
              echo "No .app or .ipa found under ios-out:"; find ios-out -maxdepth 3; exit 1
            fi
            echo "Packaging app bundle: $APP"
            rm -rf Payload; mkdir Payload; cp -R "$APP" Payload/
            zip -r -y YouTubeDownloader-ios.ipa Payload >/dev/null
          fi
          ls -lh YouTubeDownloader-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: YouTubeDownloader-ios.ipa

  # ----------------------------------------------------------------- Android
  # Self-signed APK for sideloading. Enable "install unknown apps" on the
  # device to install it. Uses the same native Core (YoutubeExplode) as iOS.
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The runner's default SDK mis-resolves net8.0-android's platform
      # version; pin the .NET 8 SDK so its Android workload builds it correctly.
      - name: Pin .NET 8 SDK
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "8.0.0",
              "rollForward": "latestFeature"
            }
          }
          JSON
          dotnet --version

      - name: Install Android workload
        run: dotnet workload install android

      - name: Ensure Android API 34 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Generate a self-signed keystore
        run: |
          keytool -genkeypair -v -keystore app.keystore -alias ytd \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass androidsideload -keypass androidsideload \
            -dname "CN=YouTube Downloader, O=Sideload, C=US"

      # `dotnet build` (not publish) runs the SignAndroidPackage target that
      # emits <pkg>-Signed.apk under bin/.
      - name: Build signed APK
        run: >
          dotnet build YouTubeDownloader.Android/YouTubeDownloader.Android.csproj
          -c Release -f net8.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=$GITHUB_WORKSPACE/app.keystore
          -p:AndroidSigningKeyAlias=ytd
          -p:AndroidSigningKeyPass=androidsideload
          -p:AndroidSigningStorePass=androidsideload

      - name: Collect APK
        run: |
          set -e
          echo "apk/aab artifacts produced:"
          find . \( -name "*.apk" -o -name "*.aab" \) | sort || true
          APK=$(find . -name "*-Signed.apk" -not -path "*/obj/*" | head -1)
          [ -n "$APK" ] || APK=$(find . -name "*-Signed.apk" | head -1)
          [ -n "$APK" ] || APK=$(find . -name "*.apk" -not -path "*/obj/*" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found."; exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" YouTubeDownloader-android.apk
          ls -lh YouTubeDownloader-android.apk

      # v3.2.0 shipped an APK that built fine but had no launcher activity and none
      # of the app's own code (an Avalonia + Android SDK path bug). Refuse to upload
      # an APK like that again.
      - name: Verify APK
        run: |
          set -e
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging YouTubeDownloader-android.apk > badging.txt
          grep -E "^package:|^sdkVersion|^targetSdkVersion|launchable-activity" badging.txt
          if ! grep -q "^launchable-activity:" badging.txt; then
            echo "::error::APK has no launcher activity, so it could not be opened"; exit 1
          fi
          if ! unzip -p YouTubeDownloader-android.apk assemblies/assemblies.manifest | grep -q "YouTubeDownloader.Android"; then
            echo "::error::APK is missing the app's own assembly"; exit 1
          fi
          echo "APK has its launcher activity and the app assembly."

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: YouTubeDownloader-android.apk

  # ----------------------------------------------------------------- Release
  release:
    needs: [windows, linux, ios, android]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          body: |
            ## Downloads

            | Platform | File | How to run |
            |----------|------|------------|
            | **Windows (x64)** | `YouTubeDownloader-windows-x64.exe` | Double-click (GUI) or run with args (CLI). |
            | **Linux (x64)** | `YouTubeDownloader-linux-x64` | `chmod +x` then run (GUI or CLI). |
            | **Android** | `YouTubeDownloader-android.apk` | Self-signed: enable "install unknown apps", then open the APK. |
            | **iPhone / iPad** | `YouTubeDownloader-ios.ipa` | Unsigned: sideload with AltStore or Sideloadly (see README). |

            Every version can search YouTube: type words instead of a link.

            ### Phone apps (Android & iOS)
            The phone builds extract YouTube natively in C#, because phones can't
            run yt-dlp or ffmpeg. They search, download **video as MP4 up to
            1080p** (H.264 video and AAC audio merged on the phone, no
            re-encoding) and **audio-only M4A**. No 1440p/4K on phones.

            Desktop (Windows/Linux) keeps the full yt-dlp + ffmpeg engine with
            all quality options, plus a command-line mode.
